name: KeepGen
options:
  bundleIdPrefix: com.yanchuan
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    CODE_SIGN_ENTITLEMENTS: ""

targets:
  KeepGenCore:
    type: framework
    platform: iOS
    sources:
      - path: Sources/KeepGenCore
    dependencies:
      - sdk: HealthKit.framework
      - sdk: CoreLocation.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yanchuan.keepgen.core
        PRODUCT_NAME: KeepGenCore
        DEFINES_MODULE: "YES"
        SKIP_INSTALL: "YES"

  KeepGenUI:
    type: framework
    platform: iOS
    sources:
      - path: Sources/KeepGenUI
    dependencies:
      - target: KeepGenCore
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yanchuan.keepgen.ui
        PRODUCT_NAME: KeepGenUI
        DEFINES_MODULE: "YES"
        SKIP_INSTALL: "YES"

  KeepGen:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "Info.plist"
          - "KeepGen.entitlements"
      # .entitlements 作为资源原样拷进 .app 根目录，给解包工具读取用
      - path: App/KeepGen.entitlements
        buildPhase: resources
    dependencies:
      - target: KeepGenUI
      - target: KeepGenCore
      - sdk: HealthKit.framework
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 运动数据生成
        CFBundleName: KeepGen
        CFBundleShortVersionString: "1.1.0"
        CFBundleVersion: "2"
        LSRequiresIPhoneOS: true
        NSHealthShareUsageDescription: "用于读取「健康」里的运动与心率数据，在本机校对生成结果是否写入成功。"
        NSHealthUpdateUsageDescription: "用于把生成的运动记录（训练、距离、活动能量、步数、心率序列与路线）写入「健康」App。"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yanchuan.keepgen.core
        PRODUCT_NAME: KeepGenCore
        DEFINES_MODULE: "YES"
        SKIP_INSTALL: "YES"

  KeepGenUI:
    type: framework
    platform: iOS
    sources:
      - path: Sources/KeepGenUI
    dependencies:
      - target: KeepGenCore
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yanchuan.keepgen.ui
        PRODUCT_NAME: KeepGenUI
        DEFINES_MODULE: "YES"
        SKIP_INSTALL: "YES"

  KeepGen:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "Info.plist"
          - "KeepGen.entitlements"
      # .entitlements 作为资源原样拷进 .app 根目录，给解包工具读取用
      - path: App/KeepGen.entitlements
        buildPhase: resources
    dependencies:
      - target: KeepGenUI
      - target: KeepGenCore
      - sdk: HealthKit.framework
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 运动数据生成
        CFBundleName: KeepGen
        CFBundleShortVersionString: "1.1.0"
        CFBundleVersion: "2"
        LSRequiresIPhoneOS: true
        NSHealthShareUsageDescription: "用于读取「健康」里的运动与心率数据，在本机校对生成结果是否写入成功。"
        NSHealthUpdateUsageDescription: "用于把生成的运动记录（训练、距离、活动能量、步数、心率序列与路线）写入「健康」App。"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
    postBuildScripts:
      - name: 把 KeepGen.entitlements 保留进 .app
        basedOnDependencyAnalysis: false
        script: |
          cp "${SRCROOT}/App/KeepGen.entitlements" "${TARGET_BUILD_DIR}/${WRAPPER_NAME}/KeepGen.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yanchuan.keepgen
        PRODUCT_NAME: KeepGen
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "2"
        GENERATE_INFOPLIST_FILE: "NO"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"